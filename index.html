    .bot-badges-container {

      align-items: center;
      gap: clamp(10px, 1.8vw, 16px);
      max-width: 1200px;

    .bot-badges-container a {
      display: inline-flex;
      align-items: center;
      transition: transform 180ms ease, opacity 180ms ease;

    }

      transform: translateY(-2px) scale(1.03);
      opacity: 0.92;
    }

    .bot-badges-container img {
      height: clamp(32px, 5vw, 44px);
      width: auto;
      max-width: 100%;
      display: block;
    }

    @media (max-width: 480px) {
      .bot-badges-container {
        gap: 8px;
      }

      .bot-badges-container img {
        height: 30px;
      }
    }

    /* Hormati preferensi reduced-motion */
    @media (prefers-reduced-motion: reduce) {

      .bot-badges-container a,
      .bot-badges-container a:hover {
        transition: none;
        transform: none;
      }
    }

    /* Default: varian dark disembunyikan (light mode) */
    .badge-dark {
      display: none;
    }
